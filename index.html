<!doctype html>
<html lang="en" data-theme="coffee">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Matchakohi — Discover the World of Coffee and Matcha</title>
    <meta
      name="description"
      content="Explore the origins, varieties, traditions, flavors, and preparation methods behind coffee and matcha with Matchakohi."
    />
    <meta name="author" content="Matchakohi" />
    <meta name="theme-color" content="#2b1d18" />
    <meta name="color-scheme" content="light" />

    <!-- Apply a saved experience before first paint to avoid a palette flash. -->
    <script>
      (function () {
        try {
          var queryTheme = new URLSearchParams(window.location.search).get('theme');
          var stored = window.localStorage.getItem('matchakohi:theme');
          var theme =
            queryTheme === 'coffee' || queryTheme === 'matcha' ? queryTheme : stored;
          if (theme === 'matcha') {
            document.documentElement.dataset.theme = 'matcha';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#315a3b');
          }
        } catch (error) {
          /* Storage may be blocked; the React provider handles the fallback. */
        }
      })();
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Matchakohi" />
    <meta property="og:title" content="Matchakohi — Two worlds. One love for the perfect cup." />
    <meta
      property="og:description"
      content="A digital magazine about coffee and matcha: their origins, cultivation, varieties, cultures, and the craft of preparation."
    />
    <meta property="og:url" content="https://mimi-kimi.github.io/Matchakohi/" />
    <meta property="og:image" content="https://mimi-kimi.github.io/Matchakohi/images/coffee-hero-1600.jpg" />
    <meta property="og:image:alt" content="Friends holding cups of freshly poured coffee" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Matchakohi — Two worlds. One love for the perfect cup." />
    <meta
      name="twitter:description"
      content="Explore the origins, varieties, traditions, flavors, and preparation methods behind coffee and matcha."
    />
    <meta name="twitter:image" content="https://mimi-kimi.github.io/Matchakohi/images/coffee-hero-1600.jpg" />

    <link rel="canonical" href="https://mimi-kimi.github.io/Matchakohi/" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Matchakohi",
        "url": "https://mimi-kimi.github.io/Matchakohi/",
        "description": "An educational digital magazine exploring the origins, cultivation, varieties, culture, and preparation of coffee and matcha.",
        "inLanguage": "en",
        "about": [
          { "@type": "Thing", "name": "Coffee" },
          { "@type": "Thing", "name": "Matcha" }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: Georgia, serif; max-width: 760px; margin: 0 auto">
        <h1>Matchakohi</h1>
        <p>
          Matchakohi is an educational magazine about coffee and matcha: where they come from, how
          they are cultivated and prepared, and the cultures that grew around them.
        </p>
        <p>Please enable JavaScript to explore the interactive coffee and matcha experiences.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
